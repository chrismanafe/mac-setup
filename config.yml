---
# Personal overrides for chrismanafe/mac-setup (fork of geerlingguy/mac-dev-playbook).
# This file IS tracked in git here (unlike upstream's template convention) since this
# fork exists to be the shared source of truth across my own Macs.
#
# Never put secrets in here (e.g. mas_email / mas_password) — leave those blank and
# supply them with --extra-vars or environment-based prompts if ever needed.

# Only .alias is symlinked here (not .zshrc/.gitconfig) so the role's
# "replace existing file" behavior can't clobber your real, already-configured
# dotfiles. ~/.alias is loaded from ~/.zshrc via tasks/source-alias.yml.
configure_dotfiles: true
dotfiles_repo: https://github.com/chrismanafe/dotfiles.git
dotfiles_repo_version: main
dotfiles_repo_local_destination: ~/.dotfiles
dotfiles_files:
  - .alias

homebrew_installed_packages:
  - uv
  - node # provides npm and npx
  - gh
  - azure-cli
  - openjdk # if macOS/IDEs can't find it, symlink per `brew info openjdk`
  - terraform # for the `tf` alias
  - kubernetes-cli # for the `k` alias
  - helm
  - jupyterlab # for the `jn`/`jl` aliases
  - neovim # for the `vi` alias
  - bat # for the `cat` alias

homebrew_taps: []

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - ghostty
  - sublime-text
  - obsidian
  - codex
  - claude-code
  - visual-studio-code
  - cursor
  - rectangle
  # karabiner-elements' installer needs a privileged .pkg install with its own
  # interactive sudo prompt, which fails non-interactively under Ansible ("a
  # terminal is required to read the password"). Install it manually first:
  #   brew install --cask karabiner-elements
  # then re-run the playbook; it'll skip it since it's already installed.
  - karabiner-elements
  - raycast
  - postman
  - docker-desktop
  - google-chrome
  - brave-browser

mas_installed_apps: []

configure_dock: false
configure_sublime: false

# Oh My Zsh has no Homebrew package; install it via a custom post-provision task.
post_provision_tasks:
  - tasks/oh-my-zsh.yml
